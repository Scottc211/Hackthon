<!DOCTYPE html>
<html>
  <head>
    <title>Pac-Man</title>
    <link rel="icon" type="image/jpeg" href="images (2).jpg" />

    <style>
      body {
        margin: 0;
        background: #000;
        overflow-x: hidden;
        font-family: Arial, sans-serif;
      }

      /* BACKGROUND FADE LAYER */
      .bg-fade {
        position: fixed;
        inset: 0;
        background-image: url('../retro-background.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        opacity: 0;
        transition: opacity 1s ease-in;
        z-index: -1;
      }

      .bg-fade.loaded {
        opacity: 1;
      }

      /* CONTENT FADE-IN */
      .fade-wrapper {
        opacity: 0;
        transition: opacity 0.8s ease-in;
      }

      .fade-wrapper.loaded {
        opacity: 1;
      }

      /* Back link */
      #returnlink {
        position: fixed;
        top: 15px;
        left: 15px;
        z-index: 400;

        font-family: 'Press Start 2P', cursive;
        font-size: 12px;
        text-shadow: 0 0 6px #00ccff;
      }

      #returnlink a {
        color: #00ccff;
        text-decoration: none;
        text-shadow: 0 0 6px #00ccff;
      }

      /* LAYOUT */
      #layout {
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 60px;
        padding-top: 40px;
        box-sizing: border-box;
      }

      /* FULLSCREEN FIXES */
      :fullscreen #gamecontainer,
      #gamecontainer:fullscreen {
        width: 100vw !important;
        height: 100vh !important;
      }

      :fullscreen #gameframe,
      #gameframe:fullscreen {
        width: 100vw !important;
        height: 100vh !important;
      }

      /* GAME CONTAINER */
      #gamecontainer {
        position: relative;
        width: 800px;
        height: 600px;
        background: black;
        border: 3px solid #00ccff;
        box-shadow: 0 0 12px #00ccff;
        max-width: 100%;
        max-height: 100%;
      }

      #gameframe {
        width: 100%;
        height: 100%;
        border: none;
      }

      /* CAMERA FEED */
      #feed-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      #feed {
        width: 320px;
        height: 240px;
        position: relative;
      }

      #input_video,
      #output_canvas {
        position: absolute;
        left: 0;
        top: 0;
        width: 320px;
        height: 240px;
      }

      #output_canvas {
        border: 2px solid #ff4444;
      }

      /* Direction arrows */
      #direction-indicator {
        margin-top: 40px;
        text-align: center;
        font-family: 'Press Start 2P', cursive !important;
        color: #00ccff;
      }

      #direction-indicator .arrow {
        display: inline-block;
        width: 80px;
        height: 80px;
        line-height: 80px;
        font-size: 64px;
        opacity: 0.3;
        transition: 0.15s ease-out;
      }

      #direction-indicator .middle-row {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #direction-indicator .arrow.active {
        opacity: 1;
        filter: drop-shadow(0 0 8px #00ccff);
      }

      /* FULLSCREEN BUTTON */
      #fullscreenBtn {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 500;
        padding: 10px 14px;
        font-size: 22px;
        font-family: 'Press Start 2P', cursive;
        background: rgba(255, 215, 0, 0.3);
        color: #00ccff;
        border: 2px solid #00ccff;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 0 8px #00ccff;
        transition: 0.15s ease-in-out;
      }

      #fullscreenBtn:hover {
        background: rgba(255, 215, 0, 0.55);
        transform: scale(1.12);
      }

      /* Volume Control */
      #volume-control {
        width: 220px;
        margin-top: 10px;
        text-align: center;
        font-family: 'Press Start 2P', cursive;
        font-size: 12px;
        color: #00ccff;
      }

      #volume-slider {
        width: 180px;
        margin-top: 6px;
        appearance: none;
        height: 6px;
        background: rgba(0, 204, 255, 0.3);
        border: 2px solid #00ccff;
        border-radius: 6px;
        outline: none;
        cursor: pointer;
        box-shadow: 0 0 8px #00ccff;
      }

      #volume-slider::-webkit-slider-thumb {
        appearance: none;
        width: 16px;
        height: 16px;
        background: #ffd700;
        border-radius: 50%;
        border: 2px;
      }

      /* NO HAND OVERLAY (debounced) */
      #no-hand-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        display: none;
        align-items: center;
        justify-content: center;
        font-family: 'Press Start 2P', cursive;
        font-size: 40px;
        color: #00ccff;
        text-shadow: 0 0 8px #00ccff;
        z-index: 200;
      }

      /* INSTRUCTION OVERLAY */
      #instruction-overlay {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 340px;
        padding: 20px;
        text-align: center;
        background: rgba(0, 0, 0, 0.75);
        border: 3px solid #00ccff;
        border-radius: 12px;
        box-shadow: 0 0 16px #00ccff;
        font-family: 'Press Start 2P', cursive;
        font-size: 12px;
        color: #00ccff;
        pointer-events: none;
        z-index: 210;
        opacity: 0;
        transition: opacity 0.6s ease-out;
      }

      #instruction-overlay.visible {
        opacity: 1;
        pointer-events: auto;
      }
      #close-instructions {
        margin-top: 15px;
        padding: 10px 16px;
        font-family: 'Press Start 2P', cursive;
        font-size: 10px;
        background: #00ccff;
        color: black;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        box-shadow: 0 0 8px #00ccff;
        transition: 0.15s ease-in-out;
      }
    </style>

    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- BACKGROUND FADE -->
    <div id="background" class="bg-fade"></div>

    <!-- OVERLAYS -->
    <div id="no-hand-overlay">NO HAND DETECTED</div>
    <div id="instruction-overlay">
      <h2>CONTROLS</h2>
      <p>👉 Point your index finger to steer</p>
      <br />
      <strong>Wave your hand to begin!</strong>
      <br /><br />
      <button id="close-instructions">GOT IT</button>
    </div>

    <!-- CONTENT FADE -->
    <div class="fade-wrapper">
      <div id="returnlink">
        <a href="menu.html">&larr; Back to Menu</a>
      </div>

      <div id="layout">
        <div id="gamecontainer">
          <button id="fullscreenBtn">⛶</button>
          <iframe id="gameframe"></iframe>
        </div>

        <div id="feed-wrapper">
          <div id="feed">
            <video id="input_video" autoplay playsinline></video>
            <canvas id="output_canvas" width="320" height="240"></canvas>
          </div>

          <div id="direction-indicator">
            <div class="arrow up">▲</div>
            <div class="middle-row">
              <div class="arrow left">◄</div>
              <div class="arrow"></div>
              <div class="arrow right">►</div>
            </div>
            <div class="arrow down">▼</div>
          </div>

          <div id="volume-control">
            VOLUME
            <br />
            <input
              type="range"
              id="volume-slider"
              min="0"
              max="1"
              step="0.01"
            />
          </div>
        </div>
      </div>
    </div>

    <!-- JS FADES -->
    <script>
      window.addEventListener('load', () => {
        document.querySelector('.fade-wrapper').classList.add('loaded');
        document.getElementById('background').classList.add('loaded');
      });
    </script>

    <!-- MediaPipe libs -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

    <script>
      const video = document.getElementById('input_video');
      const canvas = document.getElementById('output_canvas');
      const ctx = canvas.getContext('2d');

      // SINGLE SOUND EFFECT (used both by game + volume slider)
      const sndTurn = new Audio('audio/click.wav');
      sndTurn.volume = 0.5;

      // ---- VOLUME SLIDER LOGIC ----
      const allSounds = [sndTurn];
      const slider = document.getElementById('volume-slider');

      const savedVolume = parseFloat(localStorage.getItem('vgVolume'));
      const initialVolume = !isNaN(savedVolume) ? savedVolume : 0.5;

      allSounds.forEach((s) => (s.volume = initialVolume));
      slider.value = initialVolume;

      slider.addEventListener('input', () => {
        const v = parseFloat(slider.value);
        allSounds.forEach((s) => (s.volume = v));
        localStorage.setItem('vgVolume', v);
      });

      // ---- NO HAND OVERLAY (debounced) ----
      let handLastSeen = Date.now();
      const HAND_TIMEOUT = 400; // ms
      let overlayVisible = false;
      const noHandOverlay = document.getElementById('no-hand-overlay');

      // ---- INSTRUCTION OVERLAY ----
      const instructionOverlay = document.getElementById('instruction-overlay');
      const closeInstructionsBtn =
        document.getElementById('close-instructions');
      let instructionsShown = false;

      closeInstructionsBtn.addEventListener('click', () => {
        instructionOverlay.classList.remove('visible');
      });

      // ---- SETUP MEDIAPIPE HANDS ----
      const hands = new Hands({
        locateFile: (file) =>
          `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`,
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5,
      });

      let lastDirection = null;
      let stableDirection = null;
      let sameCount = 0;
      let lastSentDirection = null;

      hands.onResults((results) => {
        const now = Date.now();

        if (results.multiHandLandmarks && results.multiHandLandmarks.length) {
          // hand detected
          handLastSeen = now;
          if (overlayVisible) {
            overlayVisible = false;
            noHandOverlay.style.display = 'none';
          }
        } else {
          // no hand this frame – check timeout
          if (now - handLastSeen > HAND_TIMEOUT && !overlayVisible) {
            overlayVisible = true;
            noHandOverlay.style.display = 'flex';
          }
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (results.multiHandLandmarks) {
          for (const landmarks of results.multiHandLandmarks) {
            drawConnectors(ctx, landmarks, HAND_CONNECTIONS, {
              color: '#00FF00',
              lineWidth: 2,
            });
            drawLandmarks(ctx, landmarks, {
              color: '#FF0000',
              lineWidth: 1,
            });

            const indexTip = landmarks[8];
            const wrist = landmarks[0];

            const dx = indexTip.x - wrist.x;
            const dy = indexTip.y - wrist.y;

            // Direction line
            const startX = wrist.x * canvas.width;
            const startY = wrist.y * canvas.height;
            const endX = indexTip.x * canvas.width;
            const endY = indexTip.y * canvas.height;

            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(endX, endY);
            ctx.strokeStyle = 'blue';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Direction
            let direction = '';
            if (Math.abs(dx) > Math.abs(dy)) {
              direction = dx < 0 ? 'right' : 'left';
            } else {
              direction = dy < 0 ? 'up' : 'down';
            }

            // Smoothing
            if (direction === lastDirection) {
              sameCount++;
            } else {
              sameCount = 1;
              lastDirection = direction;
            }

            if (sameCount >= 2) {
              stableDirection = direction;
              updateArrows(stableDirection);
            }

            console.log('Stable direction:', stableDirection);

            // Only send when direction changes
            if (stableDirection && stableDirection !== lastSentDirection) {
              lastSentDirection = stableDirection;

              sndTurn.currentTime = 0;
              sndTurn.play().catch(() => {});

              switch (stableDirection) {
                case 'left':
                  sendKey('ArrowLeft');
                  break;
                case 'right':
                  sendKey('ArrowRight');
                  break;
                case 'up':
                  sendKey('ArrowUp');
                  break;
                case 'down':
                  sendKey('ArrowDown');
                  break;
              }
            }
          }
        }
      });

      // ---- CAMERA SETUP ----
      const camera = new Camera(video, {
        onFrame: async () => {
          await hands.send({ image: video });
        },
        width: 640,
        height: 480,
      });

      camera.start();

      // ---- SEND KEYS INTO GAME IFRAME ----
      function sendKey(key) {
        const iframe = document.getElementById('gameframe');
        if (!iframe || !iframe.contentWindow) return;

        const doc = iframe.contentWindow.document;

        const keyCode =
          key === 'ArrowLeft'
            ? 37
            : key === 'ArrowUp'
            ? 38
            : key === 'ArrowRight'
            ? 39
            : key === 'ArrowDown'
            ? 40
            : 0;

        function fire(type) {
          const event = doc.createEvent('KeyboardEvent');
          event.initKeyboardEvent(
            type,
            true,
            true,
            iframe.contentWindow,
            key,
            0,
            '',
            false,
            keyCode
          );

          Object.defineProperty(event, 'keyCode', { get: () => keyCode });
          Object.defineProperty(event, 'which', { get: () => keyCode });
          Object.defineProperty(event, 'key', { get: () => key });

          doc.dispatchEvent(event);
        }

        fire('keydown');
        setTimeout(() => fire('keyup'), 80);
      }

      // ---- LOAD GAME INTO IFRAME ----
      function loadGame(name) {
        const iframe = document.getElementById('gameframe');
        iframe.src = `games/${name}/index.html`;

        iframe.onload = () => {
          // show instructions ONCE, when game actually loads
          if (!instructionsShown) {
            instructionsShown = true;
            instructionOverlay.classList.add('visible');
          }

          if (iframe.contentWindow) {
            iframe.contentWindow.focus();
          }
        };
      }

      // read ?game=pacman etc
      const params = new URLSearchParams(window.location.search);
      const game = params.get('game');
      if (game) {
        loadGame(game);
      }

      // Direction arrows helper
      function updateArrows(direction) {
        const arrows = document.querySelectorAll('#direction-indicator .arrow');
        arrows.forEach((a) => a.classList.remove('active'));

        if (!direction) return;

        const selector =
          {
            up: '.up',
            down: '.down',
            left: '.left',
            right: '.right',
          }[direction] || null;

        if (selector) {
          document
            .querySelector(`#direction-indicator ${selector}`)
            .classList.add('active');
        }
      }

      // FULLSCREEN TOGGLE
      const fullscreenBtn = document.getElementById('fullscreenBtn');
      const gameContainer = document.getElementById('gamecontainer');
      const feed = document.getElementById('feed');

      function enterFullscreen() {
        feed.style.display = 'none';
        fullscreenBtn.textContent = '🗗';

        if (gameContainer.requestFullscreen) gameContainer.requestFullscreen();
        else if (gameContainer.webkitRequestFullscreen)
          gameContainer.webkitRequestFullscreen();
        else if (gameContainer.msRequestFullscreen)
          gameContainer.msRequestFullscreen();
      }

      function exitFullscreen() {
        fullscreenBtn.textContent = '⛶';
        feed.style.display = 'block';

        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        else if (document.msExitFullscreen) document.msExitFullscreen();
      }

      fullscreenBtn.onclick = () => {
        if (!document.fullscreenElement) enterFullscreen();
        else exitFullscreen();
      };

      document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement) {
          fullscreenBtn.textContent = '⛶';
          feed.style.display = 'block';
        }
      });
    </script>
  </body>
</html>
