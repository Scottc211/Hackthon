<!DOCTYPE html>
<html>
  <head>
    <title>Hand Tracking Demo</title>
    <style>
      body {
        background: #000;
        color: white;
        font-family: Arial, sans-serif;
        margin: 0;
        overflow-x: hidden;
        background-image: url('../retro-background.jpg');
      }

      /* Back link */
      #returnlink {
        position: fixed;
        top: 15px;
        left: 15px;
        font-size: 16px;
        z-index: 20;
      }

      #returnlink a {
        color: #ffd700;
        text-decoration: none;
        text-shadow: 0 0 6px #ffd700;
      }

      /* MAIN LAYOUT */
      #layout {
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 60px;
        padding-top: 40px;
        box-sizing: border-box;
      }

      /* GAME CONTAINER */
      #gamecontainer {
        width: 800px;
        height: 600px;
        background: black;
        border: 3px solid #ffd700;
        box-shadow: 0 0 18px #ffd700;
      }

      /* CAMERA FEED on the right */
      #feed-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      #feed {
        width: 320px;
        height: 240px;
        position: relative;
      }

      #input_video,
      #output_canvas {
        position: absolute;
        left: 0;
        top: 0;
        width: 320px;
        height: 240px;
      }

      #output_canvas {
        border: 2px solid #ff4444;
      }
      #direction-indicator {
        margin-top: 40px;
        text-align: center;
        font-family: 'Press Start 2P', cursive !important;
        color: #ffd700;
        z-index: 99999;
        position: relative;
      }

      #direction-indicator .arrow {
        display: inline-block;
        width: 80px;
        height: 80px;
        line-height: 80px;
        font-size: 64px;
        opacity: 0.3;
        filter: drop-shadow(0 0 6px #000);
        transition: 0.15s ease-out;
      }

      #direction-indicator .middle-row {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #direction-indicator .arrow.active {
        opacity: 1;
        color: #ffd700;
        filter: drop-shadow(0 0 8px #ffd700);
      }
    </style>
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="returnlink">
      <a href="menu.html">&larr; Back to Menu</a>
    </div>

    <div id="layout">
      <!-- GAME takes the left column -->
      <div id="gamecontainer">
        <iframe id="gameframe" width="800" height="600"></iframe>
      </div>

      <!-- VIDEO FEED placed top-right -->
      <div id="feed-wrapper">
        <div id="feed">
          <video id="input_video" autoplay playsinline></video>
          <canvas id="output_canvas" width="320" height="240"></canvas>
        </div>
        <div id="direction-indicator">
          <div class="arrow up">▲</div>
          <div class="middle-row">
            <div class="arrow left">◄</div>
            <div class="arrow center"></div>
            <div class="arrow right">►</div>
          </div>
          <div class="arrow down">▼</div>
        </div>
      </div>
    </div>

    <!-- MediaPipe libs -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

    <script>
      const video = document.getElementById('input_video');
      const canvas = document.getElementById('output_canvas');
      const ctx = canvas.getContext('2d');

      // ---- SETUP MEDIAPIPE HANDS ----
      const hands = new Hands({
        locateFile: (file) =>
          `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`,
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5,
      });

      let lastDirection = null;
      let stableDirection = null;
      let sameCount = 0;
      let lastSentDirection = null; // to avoid sending the same key constantly

      hands.onResults((results) => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (results.multiHandLandmarks) {
          for (const landmarks of results.multiHandLandmarks) {
            // Draw the hand skeleton
            drawConnectors(ctx, landmarks, HAND_CONNECTIONS, {
              color: '#00FF00',
              lineWidth: 2,
            });
            drawLandmarks(ctx, landmarks, {
              color: '#FF0000',
              lineWidth: 1,
            });

            const indexTip = landmarks[8];
            const wrist = landmarks[0];

            const dx = indexTip.x - wrist.x;
            const dy = indexTip.y - wrist.y;

            // Draw blue arrow
            const startX = wrist.x * canvas.width;
            const startY = wrist.y * canvas.height;
            const endX = indexTip.x * canvas.width;
            const endY = indexTip.y * canvas.height;

            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(endX, endY);
            ctx.strokeStyle = 'blue';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Determine direction
            let direction = '';
            if (Math.abs(dx) > Math.abs(dy)) {
              direction = dx < 0 ? 'right' : 'left';
            } else {
              direction = dy < 0 ? 'up' : 'down';
            }

            // Smoothing
            if (direction === lastDirection) {
              sameCount++;
            } else {
              sameCount = 1;
              lastDirection = direction;
            }

            if (sameCount >= 2) {
              stableDirection = direction;
              updateArrows(stableDirection);
            }

            console.log('Stable direction:', stableDirection);

            // Only send when direction changes
            if (stableDirection && stableDirection !== lastSentDirection) {
              lastSentDirection = stableDirection;

              switch (stableDirection) {
                case 'left':
                  sendKey('ArrowLeft');
                  break;
                case 'right':
                  sendKey('ArrowRight');
                  break;
                case 'up':
                  sendKey('ArrowUp');
                  break;
                case 'down':
                  sendKey('ArrowDown');
                  break;
              }
            }
          }
        }
      });

      // ---- CAMERA SETUP ----
      const camera = new Camera(video, {
        onFrame: async () => {
          await hands.send({ image: video });
        },
        width: 640,
        height: 480,
      });

      camera.start();

      // ---- SEND KEYS INTO GAME IFRAME ----
      function sendKey(key) {
        const iframe = document.getElementById('gameframe');
        if (!iframe || !iframe.contentWindow) return;

        const doc = iframe.contentWindow.document;

        const keyCode =
          key === 'ArrowLeft'
            ? 37
            : key === 'ArrowUp'
            ? 38
            : key === 'ArrowRight'
            ? 39
            : key === 'ArrowDown'
            ? 40
            : key === 'a'
            ? 65
            : key === 'w'
            ? 87
            : key === 's'
            ? 83
            : key === 'd'
            ? 68
            : 0;

        function fire(type) {
          const event = doc.createEvent('KeyboardEvent');
          event.initKeyboardEvent(
            type, // "keydown" or "keyup"
            true, // bubbles
            true, // cancelable
            iframe.contentWindow,
            key, // key
            0, // location
            '', // modifiers
            false, // repeat
            keyCode // keyCode
          );

          Object.defineProperty(event, 'keyCode', { get: () => keyCode });
          Object.defineProperty(event, 'which', { get: () => keyCode });
          Object.defineProperty(event, 'key', { get: () => key });

          doc.dispatchEvent(event);
        }

        fire('keydown');
        setTimeout(() => fire('keyup'), 80);
      }

      // ---- LOAD GAME INTO IFRAME ----
      function loadGame(name) {
        const iframe = document.getElementById('gameframe');
        iframe.src = `games/${name}/index.html`;

        iframe.onload = () => {
          // Try to focus so real keyboard also works
          if (iframe.contentWindow) {
            iframe.contentWindow.focus();
          }
        };
      }
    </script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const game = params.get('game');

      if (game) {
        loadGame(game);
      }
    </script>
    <script>
      function updateArrows(direction) {
        const arrows = document.querySelectorAll('#direction-indicator .arrow');
        arrows.forEach((a) => a.classList.remove('active'));

        if (!direction) return;

        const selector = {
          up: '.up',
          down: '.down',
          left: '.left',
          right: '.right',
        }[direction];

        if (selector) {
          document
            .querySelector(`#direction-indicator ${selector}`)
            .classList.add('active');
        }
      }
    </script>
  </body>
</html>
