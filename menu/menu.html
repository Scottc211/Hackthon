<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Purple Box Carousel</title>

<style>
  body {
    margin: 0;
    padding: 0;

    background-image: url("Screenshot 2025-11-15 153016.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  :root {
    --carousel-offset-x: 20px;
    --carousel-height: 92%;
  }

  /* Purple box area (now clean, no haze) */
  .purple-box-area {
    width: 70vw;
    max-width: 1100px;
    height: var(--carousel-height);
    aspect-ratio: 16 / 9;

    border: none;
    box-sizing: border-box;

    display: flex;
    justify-content: center;
    align-items: center;

    position: relative;
    left: var(--carousel-offset-x);
  }

  .carousel-container {
    width: 90%;
    height: 90%;
    position: relative;
    overflow: hidden;
  }

  .carousel-track {
    display: flex;
    width: 100%;
    height: 100%;
    transition: transform 0.5s ease-in-out;
  }

  .carousel-item {
    min-width: 100%;
    height: 100%;
    position: relative;
  }

  .carousel-item img.static,
  .carousel-item img.gif {
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: absolute;
    left: 0;
    top: 0;
  }

  .carousel-item img.static {
    z-index: 1;
    transition: opacity 0.25s ease-out;
  }

  .carousel-item img.gif {
    z-index: 0;
    opacity: 1; /* always playing underneath */
  }

  /* Hover shows GIF by hiding static image */
  .carousel-item:hover .static {
    opacity: 0;
  }

  /* Play button ABOVE everything – but NOT inside .carousel-item */
  .play-btn {
    position: absolute;
    z-index: 10;
    width: 110px;
    height: 110px;
    cursor: pointer;

    opacity: 0.85;
    transition: opacity 0.2s ease-out;

    /* centered over container, not inside slide (important fix) */
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: auto;
  }

  .play-btn:hover {
    opacity: 1;
  }

  .btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.85);
    border: none;
    padding: 8px 14px;
    cursor: pointer;
    font-size: 22px;
    border-radius: 10px;
    transition: 0.2s;
    z-index: 12;
  }

  .btn:hover {
    background: white;
  }

  #prev { left: 15px; }
  #next { right: 15px; }
</style>

</head>
<body>

<div class="purple-box-area">
  <div class="carousel-container">

    <!-- Play button is OUTSIDE the .carousel-item -->
    <img id="playButton" class="play-btn" src="play.png" alt="Play">

    <div class="carousel-track" id="track">

      <div class="carousel-item" data-link="https://example.com/game1">
        <img class="static" src="image1.jpg">
        <img class="gif" src="snake.gif">
      </div>

      <div class="carousel-item" data-link="https://example.com/game2">
        <img class="static" src="image2.jpg">
        <img class="gif" src="pacman.gif">
      </div>

      <div class="carousel-item" data-link="https://example.com/game3">
        <img class="static" src="image3.jpg">
        <img class="gif" src="spaceinvaders.gif">
      </div>

    </div>

    <button id="prev" class="btn">&#10094;</button>
    <button id="next" class="btn">&#10095;</button>
  </div>
</div>

<script>
let index = 0;
const track = document.getElementById("track");
const slides = document.querySelectorAll(".carousel-item");
const playBtn = document.getElementById("playButton");
const total = slides.length;

function update() {
  track.style.transform = `translateX(${-index * 100}%)`;
}

document.getElementById("prev").onclick = () => {
  index = (index - 1 + total) % total;
  update();
};

document.getElementById("next").onclick = () => {
  index = (index + 1) % total;
  update();
};

playBtn.onclick = () => {
  const activeSlide = slides[index];
  const url = activeSlide.getAttribute("data-link");
  if (url) window.location.href = url;
};
</script>

</body>
</html>
