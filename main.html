<!DOCTYPE html>
<html>
  <head>
    <title>Hand Tracking Demo</title>
    <style>
      #output_canvas {
        border: 2px solid red;
        width: 640px;
        height: 480px;
      }
    </style>
  </head>
  <body>
    <h1>HAND TRACKING TEST</h1>

    <div id="feed">
      <video id="input_video" autoplay playsinline></video>
      <canvas id="output_canvas" width="640" height="480"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

    <script>
      const video = document.getElementById('input_video');
      const canvas = document.getElementById('output_canvas');
      const ctx = canvas.getContext('2d');

      video.setAttribute('playsinline', true);

      const hands = new Hands({
        locateFile: (file) =>
          `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`,
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5,
      });
let lastDirection = null;
let stableDirection = null;
let sameCount = 0;
hands.onResults((results) => {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (results.multiHandLandmarks) {
    for (const landmarks of results.multiHandLandmarks) {

      // Draw the hand skeleton
      drawConnectors(ctx, landmarks, HAND_CONNECTIONS, {
        color: '#00FF00',
        lineWidth: 2,
      });
      drawLandmarks(ctx, landmarks, {
        color: '#FF0000',
        lineWidth: 1,
      });

      // ------------------------------
      // GET INDEX FINGER TIP + WRIST
      // ------------------------------
      const indexTip = landmarks[8];   // Index fingertip landmark
      const wrist = landmarks[0];      // Wrist landmark (palm reference)

      // Direction vector
      const dx = indexTip.x - wrist.x;
      const dy = indexTip.y - wrist.y;

      // ------------------------------
      // DRAW BLUE ARROW (POINTING DIR)
      // ------------------------------
      const startX = wrist.x * canvas.width;
      const startY = wrist.y * canvas.height;
      const endX = indexTip.x * canvas.width;
      const endY = indexTip.y * canvas.height;

      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(endX, endY);
      ctx.strokeStyle = "blue";
      ctx.lineWidth = 4;
      ctx.stroke();

// --- RAW DIRECTION ---
let direction = "";

if (Math.abs(dx) > Math.abs(dy)) {
  direction = dx < 0 ? "right" : "left";
} else {
  direction = dy < 0 ? "up" : "down";
}

// --- SMOOTHING / DEBOUNCING ---
if (direction === lastDirection) {
  sameCount++;
} else {
  sameCount = 1;          // restart count
  lastDirection = direction;
}

// Update only if consistent for 4 frames
if (sameCount >= 4) {
  stableDirection = direction;
}

console.log("Stable direction:", stableDirection);
    }
  }
});

      const camera = new Camera(video, {
        onFrame: async () => {
          await hands.send({ image: video });
        },
        width: 640,
        height: 480,
      });

      camera.start();
    </script>
  </body>
</html>
