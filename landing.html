<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VideoGamer – Hackathon 2025</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: #000;
        color: #ffd700;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: 'Press Start 2P', cursive;
        text-align: center;
      }

      h1 {
        font-size: 96px;
        margin: 0;
        letter-spacing: 4px;
        text-shadow: 0 0 12px #ffd700;
        animation: glow 2s ease-in-out infinite alternate;
      }

      @keyframes glow {
        from {
          text-shadow: 0 0 5px #ffd700;
        }
        to {
          text-shadow: 0 0 20px #ffd700;
        }
      }

      h2 {
        margin-top: 30px;
        font-size: 20px;
        letter-spacing: 2px;
      }

      .retro-button {
        display: inline-block;
        margin-top: 25px;
        padding: 14px 28px;
        background: #ffd700;
        color: #000;
        text-decoration: none;
        font-size: 18px;
        border: 4px solid #000;
        box-shadow: 0 0 0 4px #ffd700, 0 0 12px #ffd700;
        transition: transform 0.1s, box-shadow 0.2s;
      }

      .retro-button:hover {
        transform: scale(1.05);
        box-shadow: 0 0 0 4px #ffd700, 0 0 18px #ffd700;
      }

      @media (max-width: 600px) {
        h1 {
          font-size: 48px;
        }
        h2 {
          font-size: 14px;
        }
        .retro-button {
          font-size: 14px;
          padding: 10px 20px;
        }
      }
    </style>
  </head>

  <body>
    <h1>VideoGamer</h1>
    <h2>Retro Gameplay • Hand Tracking • HackRPI 2025</h2>

    <a class="retro-button" href="menu/main.html">ENTER</a>

    <h2 style="margin-top: 40px; font-size: 14px">by Rayyan & Charles</h2>
  </body>
</html>
